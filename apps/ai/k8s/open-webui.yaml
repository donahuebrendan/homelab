apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: rp5-master

      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.5-slim
          imagePullPolicy: IfNotPresent

          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"

            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: secret-key

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"

          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data

      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data

---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
