apiVersion: v1
kind: Service
metadata:
  name: argocd-server-lan
  namespace: argocd
  labels:
    svccontroller.k3s.cattle.io/lbpool: argocd
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 8443
      targetPort: 8080
      protocol: TCP
